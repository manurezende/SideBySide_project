<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Jovem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/editar_jovem_idoso.css">
</head>
<body class="bg-light">
    <header>
        <div class="logo">SIDEBYSIDE</div>
        <nav>
            <a href="./pagina_listar_idoso.html">Idosos</a>
            <a href="./pagina_salvo_do_jovem.html">Salvos</a>
            <a href="./mensagens_do_jovem.html">Mensagens</a>
            <div class="user-menu">
                <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
                <div class="dropdown" id="dropdown">
                    <a href="#">Meu perfil</a>
                    <a href="./editar_jovem.html">Ajustes da conta</a>
                    <div class="premium">
                        <div>
                            <strong>Obter Premium</strong>
                            <a href="premium_do_jovem.html"><p>Converse com quantos Idosos você quiser.</p></a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h2 class="mb-4 text-center">Editar Perfil</h2>
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="./img/fotos.jpg" class="img-fluid rounded-circle mb-3" alt="Foto de perfil" id="imgPerfilJovem">
                <button class="btn btn-outline-secondary btn-sm" id="btnTrocarFoto">Trocar Foto</button>
            </div>

            <div class="col-md-8">
                <form id="formUsuario" class="mb-5">
                    <h3>Dados da Conta</h3>
                    <div class="mb-3">
                        <label for="nome_completo" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome_completo" placeholder="Seu nome completo">
                    </div>
                    <div class="mb-3">
                        <label for="nome_usuario" class="form-label">Nome de Usuário</label>
                        <input type="text" class="form-control" id="nome_usuario" placeholder="Seu nome de usuário">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com">
                    </div>
                    
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Salvar Dados da Conta</button>
                    </div>
                </form>

                <form id="formJovem" class="mb-5">
                    <h3>Dados Pessoais do Jovem</h3>
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="mb-3">
                        <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="data_nascimento">
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="mb-3">
                        <label for="genero" class="form-label">Gênero</label>
                        <select class="form-select" id="genero">
                            <option value="1">Masculino</option>
                            <option value="0">Feminino</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="experiencia" class="form-label">tempo de experiencia</label>
                        <textarea class="form-control" id="experiencia" rows="3" placeholder="quanto "></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" rows="2" placeholder="Descrição breve..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="valor_hora" class="form-label">Valor por Hora</label>
                        <input type="number" class="form-control" id="valor_hora" placeholder="Exemplo: 50">
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Salvar Dados Pessoais</button>
                    </div>
                </form>

                <form id="formEndereco" class="mb-5">
                    <h3>Endereço</h3>
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label for="cep" class="form-label">CEP</label>
                            <input type="text" class="form-control" id="cep">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="logradouro" class="form-label">Logradouro</label>
                            <input type="text" class="form-control" id="logradouro" placeholder="Rua, Avenida...">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="logradouro_nome" class="form-label">Nome do Logradouro</label>
                            <input type="text" class="form-control" id="logradouro_nome" placeholder="Nome do logradouro">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="numero" class="form-label">Número</label>
                            <input type="text" class="form-control" id="numero">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" class="form-control" id="bairro">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="complemento" class="form-label">Complemento</label>
                            <input type="text" class="form-control" id="complemento">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="cidade">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <input type="text" class="form-control" id="estado">
                        </div>
                       
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary">Salvar Endereço</button>
                    </div>
                </form>

            </div>
        </div>
    </main>

     <script>
        // Função para alternar a exibição do dropdown
        function toggleDropdown() {
            const menu = document.getElementById("dropdown");
            menu.classList.toggle("active"); // Adiciona ou remove a classe 'active'
        }

        // Fechar o dropdown ao clicar fora dele
        window.onclick = function (event) {
            const avatar = document.querySelector('.avatar');
            const dropdown = document.getElementById("dropdown");

            // Verifica se o clique não foi no avatar ou no dropdown
            if (!dropdown.contains(event.target) && event.target !== avatar) {
                dropdown.classList.remove("active");
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
