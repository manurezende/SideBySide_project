<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Idosos Cadastrados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/listar_idoso.css" />
  <link rel="stylesheet" href="css/ondas.css">
</head>
<body>

  <!-- Reader e Dropdown já prontos do seu projeto -->
  <header>
    <div class="logo">SIDEBYSIDE</div>
    <nav>
      <a href="./pagina_listar_idoso.html">Idosos</a>
      <a href="./pagina_salvo_do_idoso.html">Salvos</a>
      <a href="./mensagens_do_idoso.html">Mensagens</a>
      <div class="user-menu">
        <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
        <div class="dropdown" id="dropdown">
          <a href="./editar_idoso.html">Meu perfil</a>
          <a href="./editar_idoso.html">Ajustes da conta</a>
          <div class="premium">
            <div>
              <strong>Obter Premium</strong>
              <a href="premium_do_idoso.html"><p>Converse com quantos Jovens quiser.</p></a>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Título -->
  <section class="text-center my-5">
    <h1 style="color: #5432cf; font-weight: bold;">Idosos Cadastrados</h1>
  </section>

  <!-- Lista de Idosos -->
  <div class="container pb-5">
    <div class="row" id="lista-idosos">
      <!-- Cards são inseridos aqui via JavaScript -->
    </div>
  </div>

  <script>
    // Dados falsos para simular os idosos cadastrados
    const idosos = [
      { nome: "Maria das Graças", cidade: "São Paulo", experiencia: "5 anos", imagem: "img/idosa1.jpg" },
      { nome: "João Batista", cidade: "Campinas", experiencia: "3 anos", imagem: "img/idoso1.jpg" },
      { nome: "José Carlos", cidade: "Rio de Janeiro", experiencia: "2 anos", imagem: "img/idoso2.jpg" },
      { nome: "Ana Lúcia", cidade: "Belo Horizonte", experiencia: "4 anos", imagem: "img/idosa2.jpg" },
      { nome: "Francisca Gomes", cidade: "Salvador", experiencia: "1 ano", imagem: "img/idosa3.jpg" },
      { nome: "Antônio Alves", cidade: "Fortaleza", experiencia: "6 anos", imagem: "img/idoso3.jpg" },
      { nome: "Sebastião Rocha", cidade: "Curitiba", experiencia: "3 anos", imagem: "img/idoso4.jpg" },
      { nome: "Lourdes Martins", cidade: "Brasília", experiencia: "2 anos", imagem: "img/idosa4.jpg" },
      { nome: "Pedro Henrique", cidade: "Recife", experiencia: "5 anos", imagem: "img/idoso5.jpg" },
      { nome: "Helena Silva", cidade: "Porto Alegre", experiencia: "4 anos", imagem: "img/idosa5.jpg" }
    ];

    const lista = document.getElementById('lista-idosos');

    idosos.forEach(idoso => {
      const card = document.createElement('div');
      card.className = 'col-md-4 col-lg-3 mb-4';
      card.innerHTML = `
        <div class="card shadow-sm border-0 h-100">
          <img src="${idoso.imagem}" class="card-img-top" alt="${idoso.nome}">
          <div class="card-body">
            <h5 class="card-title">${idoso.nome}</h5>
            <p class="card-text text-muted">${idoso.cidade}</p>
            <p class="mb-1">Experiência: <strong>${idoso.experiencia}</strong></p>
            <button class="btn w-100 text-white" style="background-color: #5432cf;">Ver Perfil</button>
          </div>
        </div>
      `;
      lista.appendChild(card);
    });

    // Dropdown
    function toggleDropdown() {
      const menu = document.getElementById("dropdown");
      menu.classList.toggle("active");
    }

    window.onclick = function(e) {
      if (!e.target.matches('.avatar')) {
        const dropdown = document.getElementById("dropdown");
        dropdown.classList.remove("active");
      }
    };
  </script>
</body>
</html>
