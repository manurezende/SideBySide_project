<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Salvos - SIDEBYSIDE</title>
  <link rel="stylesheet" href="css/style3.css">
</head>
<body>
    <header>
        <div class="logo">SIDEBYSIDE</div>
        <nav>
          <a href="./pagina_listar_idoso.html">Idosos</a>
          <a href="./pagina_salvo_do_jovem.html">Salvo</a>
          <a href="./mensagens_do_jovem.html">Mensagens </a>
          <div class="user-menu">
            <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
            <div class="dropdown" id="dropdown">
              <a href="#">Meu perfil</a>
              <a href="./editar_jovem.html">Ajustes da conta</a>
              <div class="premium">
                <div>
                  <strong>Obter Premium</strong>
                  <a href="premium_do_jovem.html"><p>Converse com quantos Idosos você quiser.</p></a>
                  
                </div>
               
              </div>
            </div>
          </div>
        </nav>
      </header>
    
      <script>
        function toggleDropdown() {
          const menu = document.getElementById("dropdown");
          menu.classList.toggle("active");
        }
    
        window.onclick = function(e) {
          if (!e.target.matches('.avatar')) {
            const dropdown = document.getElementById("dropdown");
            dropdown.classList.remove("active");
          }
        }
      </script>
  <main class="salvo-container">
    <div class="mensagem-salvo">
      <!-- <img src="img/heart.svg" alt="Favorito" /> ..-->
      <p> &#x2764;&#xFE0F; Você ainda não tem favoritos selecionados</p>
    </div>
    <button class="btn-salvo">Busque Jovens</button>
  </main>
</body>
</html>
