<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - SIDEBYSIDE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <!-- Cabeçalho com logo e navegação -->
   <header>
    <img src="./img/logo2.png" alt="Logo SideBySide" class="logo" />
    <nav>
      <ul class="itens-nav">
        <li ><a href="index.html">Início</a></li>
        <li ><a href="login.html">Login</a></li>
        <li ><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>


  <!-- Formulário de login -->
  <section class="form-container">
    <h2>Login</h2>
    <form action="#" method="post">
      <input type="email" placeholder="Seu e-mail" required />
      <input type="password" placeholder="Sua senha" required />
      <button class="section_button" type="submit">Entrar</button>
    </form>
    <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </section>

</body>
</html>
