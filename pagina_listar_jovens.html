<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>SIDEBYSIDE</title>
  <link rel="stylesheet" href="./css/header.css" />
  <link rel="stylesheet" href="./css/listar_jovem.css">
</head>
<body onload="carregarJovens()">
  <header>
    <div class="logo">SIDEBYSIDE</div>
     <a href="pagina_listar_jovens.html"></a>
    <nav>
      <a href="./pagina_listar_jovens.html">Jovens</a>
      <a href="./pagina_salvo_do_idoso.html">Salvo</a>
      <a href="./mensagens_do_idoso.html">Mensagens </a>
      <div class="user-menu">
        <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
        <div class="dropdown" id="dropdown">
          <a href="editar_idoso.html">Meu perfil</a>
          <a href="#">Ajustes da conta</a>
          <div class="premium">
            <div>
              <strong>Obter Premium</strong>
              <a href="premium_do_idoso.html"><p>Converse com quantos jovens você quiser.</p></a>
              
            </div>
           
          </div>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="carrossel-jovens">
      <h2>Últimos jovens cadastrados</h2>
    
      <div class="carrossel-wrapper">
        <button class="carrossel-btn esquerda" onclick="scrollCarrossel(-1)">❮</button>
        
        <div class="carrossel-container" id="carrosselJovens">
          <!-- Os cards dos jovens serão inseridos aqui via JS -->
        </div>
    
        <button class="carrossel-btn direita" onclick="scrollCarrossel(1)">❯</button>
      </div>
    </section>

    
</main>
<script src="./js/pagina_listar_jovens.js"></script>


  <script>
    function toggleDropdown() {
      const menu = document.getElementById("dropdown");
      menu.classList.toggle("active");
    }

    window.onclick = function(e) {
      if (!e.target.matches('.avatar')) {
        const dropdown = document.getElementById("dropdown");
        dropdown.classList.remove("active");
      }
    }
  </script>
</body>
</html>
