<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens | SIDEBYSIDE</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/header.css">         <link rel="stylesheet" href="./css/mensagens.css">   
  <link rel="stylesheet" href="./css/header.css">   </head>
<body>
    <header>
        <div class="logo">SIDEBYSIDE</div>
        <nav>
            <a href="./pagina_listar_jovens.html">Jovens</a> <a href="./pagina_salvo_do_idoso.html">Salvos</a>
            <a href="./mensagens_do_idoso.html">Mensagens</a>
            <div class="user-menu">
                <img src="./img/vl.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
                <div class="dropdown" id="dropdown">
                    <a href="./perfil_idoso.html">Meu perfil</a>
                    <a href="./editar_idoso.html">Ajustes da conta</a>
                    <div class="premium">
                        <div>
                            <strong>Obter Premium</strong>
                            <a href="premium_do_idoso.html"><p>Converse com quantos Jovens você quiser.</p></a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="container">

        <section class="login">
            <h2>Login</h2>
            <form class="login__form">
                <input type="text" class="login__input" placeholder="Seu nome" required />
                <button type="submit" class="login__button">Entrar</button>
            </form>
        </section>

        <section class="chat">
            <section class="chat__messages">
                </section>

            <form class="chat__form">
                <input type="text" class="chat__input" placeholder="Digite uma mensagem" required />
                <button type="submit" class="chat__button">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>
        </section>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>          <script src="./js/header_utils.js"></script>    <script src="./js/mensagens_do_idoso.js"></script> <script>
        function toggleDropdown() {
            const menu = document.getElementById("dropdown");
            menu.classList.toggle("active");
        }

        window.onclick = function (event) {
            const avatar = document.querySelector('.avatar');
            const dropdown = document.getElementById("dropdown");

            if (!dropdown.contains(event.target) && event.target !== avatar) {
                dropdown.classList.remove("active");
            }
        }
    </script>
</body>
</html>
