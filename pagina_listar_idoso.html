<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIDEBYSIDE - Idosos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/listar_idoso.css">
</head>
<body>
    <header>
        <div class="logo">SIDEBYSIDE</div>
        <nav>
            <a href="pagina_listar_idoso.html">Idosos</a>
            <a href="./pagina_salvo_do_jovem.html">Salvos</a>
            <a href="./mensagens_do_jovem.html">Mensagens</a>
            <div class="user-menu">
                <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
                <div class="dropdown" id="dropdown">
                    <a href="perfil_jovem.html">Meu perfil</a>
                    <a href="editar_jovem.html">Ajustes da conta</a>
                    <div class="premium">
                        <div>
                            <strong>Obter Premium</strong>
                            <a href="premium_do_jovem.html"><p>Converse com quantos Idosos você quiser.</p></a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="carrossel-idosos">
            <h2>Últimos idosos cadastrados</h2>

            <div class="carrossel-wrapper">
                <button class="carrossel-btn esquerda" onclick="scrollCarrossel(-1)">
                    <i class="fas fa-chevron-left"></i>
                </button>

                <div class="carrossel-container" id="carrosselIdosos">
                    </div>

                <button class="carrossel-btn direita" onclick="scrollCarrossel(1)">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <!-- Botão "Mostrar todos os Idosos" -->
            <div class="text-center mt-4">
                <a href="./buscar_idoso.html" class="btn-mostrar-todos">Mostrar todos os Idosos</a>
            </div>
        </section>
    </main>
     <script src="./js/script.js"></script> <script src="./js/foto_header.js"></script>

    <script src="./js/pagina_listar_idosos.js"></script>

    <script>
        function toggleDropdown() {
            const menu = document.getElementById("dropdown");
            menu.classList.toggle("active");
        }

        window.onclick = function(e) {
            if (!e.target.matches('.avatar')) {
                const dropdown = document.getElementById("dropdown");
                if (dropdown.classList.contains("active")) {
                    dropdown.classList.remove("active");
                }
            }
        }
    </script>
</body>
</html>
