<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Jovem</title>

  <!-- Link para o CSS externo -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Formulário principal -->
  <form id="form-jovem" class="form_jovem" action="#" method="post" onsubmit="return false">

    <!-- Barra de progresso no topo -->
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Etapa 1: Dados Pessoais -->
    <div class="form-step-active">
      <h2 class="title_form_mult">Dados Pessoais</h2>
      <input type="text" id="cpf" name="cpf" placeholder="CPF" required />
      <input type="date" name="data_nascimento" id="data_nascimento" required />
      <input type="text" name="descricao" id="descricao" placeholder="Descrição" required />
      <button type="button" class="btn-next" onclick="form_step1()">Próximo</button>
    </div>

    <!-- Etapa 2: Contato -->
    <div class="form-step">
      <h2 class="title_form_mult">Contato</h2>
      <input type="text" name="telefone" id="telefone" placeholder="Telefone" required />
      <input type="email" name="email" id="email" placeholder="E-mail" required />
      <button type="button" class="btn-next" onclick="form_step2()">Próximo</button>
    </div>

    <!-- Etapa 3: Endereço -->
    <div class="form-step">
      <h2 class="title_form_mult">Endereço</h2>
      <input type="text" name="logradouro" id="logradouro" placeholder="Logradouro" required />
      <input type="text" name="bairro" id="bairro" placeholder="Bairro" required />
      <input type="text" name="cidade" id="cidade" placeholder="Cidade" required />
      <input type="text" name="estado" id="estado" placeholder="Estado" required />
      <button type="button" class="btn-next" onclick="form_step3()">Próximo</button>
    </div>

    <!-- Etapa 4: Foto -->
    <div class="form-step">
      <h2 class="title_form_mult">Foto</h2>
      <input type="file" name="foto" id="foto" />
      <button type="button" class="btn-next" onclick="form_step4()">Próximo</button>
    </div>

    <!-- Etapa 5: Assinante -->
    <div class="form-step">
      <h2 class="title_form_mult">Assinante</h2>
      <label for="assinante_sim">Sim</label>
      <input type="radio" id="assinante_sim" name="assinante" value="1" required />
      <label for="assinante_nao">Não</label>
      <input type="radio" id="assinante_nao" name="assinante" value="0" required />
      <button type="submit" class="btn-submit">Cadastrar</button>
    </div>

  </form>

  <!-- JS externo -->
  <script src="./js/script.js"></script>
</body>
</html>
