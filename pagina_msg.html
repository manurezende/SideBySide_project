<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Side By Side</title>

  <!-- Link para o CSS externo -->
  <link rel="stylesheet" href="./css/style_msg.css" />

  <!-- Importa o cliente Socket..IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="container-chat">
    
    <!-- Cabeçalho com nome do usuário logado -->
    <div class="cabecalho-chat">
      <h2>Bem-vindo, <span id="usuario-logado">...</span></h2>
    </div>

    <!-- Campo para digitar o nome do destinatário -->
    <div class="contatos">
      <input type="text" id="nome-destinatario" placeholder="Digite o nome do destinatário" />
    </div>

    <!-- Área onde aparecem as mensagens -->
    <div class="mensagens" id="area-mensagens">
      <!-- As mensagens enviadas e recebidas serão exibidas aqui -->
    </div>

    <!-- Campo para enviar mensagem -->
    <div class="formulario-mensagem">
      <input type="text" id="mensagem" placeholder="Digite sua mensagem" />
      <button id="enviar">Enviar</button>
    </div>

  </div>

  <!-- JavaScript externo -->
  <script src="./js/msg.js"></script>
</body>
</html>
