
<!DOCTYPE html>
<html lang="pt-br"> <!-- Define o idioma da página como português do Brasil -->
<head>
  <meta charset="UTF-8"> <!-- Define a codificação de caracteres -->
  <title>Cadastro - SIDEBYSIDE</title> <!-- Título da aba do navegador -->
  <link rel="stylesheet" href="css/style.css"> <!-- Importa o arquivo CSS externo -->
</head>

<body class="backgroud-color-cadastro"> <!-- Corpo da página com classe para estilo -->

   <!-- Cabeçalho com logo e navegação -->
   <header>
    <img src="./img/logo2.png" alt="Logo SideBySide" class="logo" />
    <nav>
      <ul class="itens-nav">
        <li ><a href="index.html">Início</a></li>
        <li ><a href="login.html">Login</a></li>
        <li ><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <form action="#" method="post" onsubmit="return false">

    <section class="form-usuario">
      <h2>Cadastro de Usuário</h2>
      <div class="div_usuario">
        <input type="email" name="email" id="email" placeholder="E-mail" required />
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Nome completo" required />
        <input type="text" name="nome_usuario" id="nome_usuario" placeholder="Nome de usuário" required />
        <input type="password" name="senha" id="senha" placeholder="Senha" required />
        
        <!-- Tipo de usuário: rádio -->
        <div class="tipo_usuario_radio">
          <p>Tipo de usuário:</p>
          <input type="radio" id="tipo_usuario_jovem" name="tipo_usuario" value="1" required />
          <label for="tipo_usuario_jovem">Jovem</label>
  
          <input type="radio" id="tipo_usuario_idoso" name="tipo_usuario" value="0" required />
          <label for="tipo_usuario_idoso">Idoso</label>
        </div>
      </div>
    </section>
  
    <button class="section_button" type="submit" id="botao_cadastrar_usuario">Cadastrar Usuário</button>
  
  </form>
  
  <form action="#" method="post" onsubmit="return false">

    <!-- Endereço -->
    <section class="section_endereco">
      <h2>Endereço</h2>
      <div class="div_endereco">
        <select name="logradouro" id="logradouro" required>
          <option value="">Tipo de logradouro</option>
          <option value="Rua">Rua</option>
          <option value="Avenida">Avenida</option>
          <option value="Alameda">Alameda</option>
          <option value="Travessa">Travessa</option>
          <option value="Praça">Praça</option>
          <option value="Estrada">Estrada</option>
          <option value="Rodovia">Rodovia</option>
          <option value="Viela">Viela</option>
        </select>
  
        <input type="text" name="logradouro_nome" id="logradouro_nome" placeholder="Nome do logradouro" required />
        <input type="text" name="numero" id="numero" placeholder="Número" required />
        <input type="text" name="complemento" id="complemento" placeholder="Complemento" />
        <input type="text" name="cidade" id="cidade" placeholder="Cidade" required />
        <input type="text" name="estado" id="estado" placeholder="Estado" required />
        <input type="text" name="bairro" id="bairro" placeholder="Bairro" required />
        <input type="text" name="cep" id="cep" placeholder="CEP" required />
        <input type="text" name="pais" id="pais" placeholder="País" value="Brasil" required />
      </div>
    </section>
  
    <!-- Jovem -->
    <section class="section_jovem">
      <h2>Cadastro Jovem</h2>
      <div class="div_jovem">
        <input type="tel" name="telefone_celular_jovem" id="telefone_celular_jovem" placeholder="Telefone celular" required />
        <input type="text" name="cpf_jovem" id="cpf_jovem" placeholder="CPF" required />
        <input type="date" name="data_nascimento_jovem" id="data_nascimento_jovem" placeholder="Data de nascimento" required />
        <textarea name="experiencia" id="experiencia" placeholder="Experiência (opcional)"></textarea>
        <input type="text" name="chave_pix" id="chave_pix" placeholder="Chave Pix (opcional)" />
        <input type="text" name="descricao_jovem" id="descricao_jovem" placeholder="Descrição" required />
  
        <!-- Gênero: rádio -->
        <div class="genero_jovem_radio">
          <p>Gênero:</p>
          <input type="radio" id="genero_jovem_masculino" name="genero_jovem" value="1" required />
          <label for="genero_jovem_masculino">Masculino</label>
  
          <input type="radio" id="genero_jovem_feminino" name="genero_jovem" value="0" required />
          <label for="genero_jovem_feminino">Feminino</label>
        </div>
      </div>
    </section>
  
    <!-- Idoso -->
    <section class="section_idoso">
      <h2>Cadastro Idoso</h2>
      <div class="div_idoso">
        <input type="tel" name="telefone_celular_idoso" id="telefone_celular_idoso" placeholder="Telefone celular" required />
        <input type="text" name="cpf_idoso" id="cpf_idoso" placeholder="CPF" required />
        <input type="date" name="data_nascimento_idoso" id="data_nascimento_idoso" placeholder="Data de nascimento" required />
  
        <!-- Comorbidade: rádio -->
        <div class="comorbidade_idoso_radio">
          <p>Comorbidade:</p>
          <input type="radio" id="comorbidade_sim" name="comorbidade" value="1" required />
          <label for="comorbidade_sim">Sim</label>
  
          <input type="radio" id="comorbidade_nao" name="comorbidade" value="0" required />
          <label for="comorbidade_nao">Não</label>
        </div>
  
        <input type="text" name="tipo_comorbidade" id="tipo_comorbidade" placeholder="Tipo de comorbidade (se houver)" />
        <input type="text" name="descricao_idoso" id="descricao_idoso" placeholder="Descrição" required />
  
        <!-- Gênero: rádio -->
        <div class="genero_idoso_radio">
          <p>Gênero:</p>
          <input type="radio" id="genero_idoso_masculino" name="genero_idoso" value="1" required />
          <label for="genero_idoso_masculino">Masculino</label>
  
          <input type="radio" id="genero_idoso_feminino" name="genero_idoso" value="0" required />
          <label for="genero_idoso_feminino">Feminino</label>
        </div>
      </div>
    </section>
  
    <button class="section_button" type="submit" id="botao_cadastrar_jovem_idoso">Cadastrar</button>
  
  </form>
  
      
      
  
  <script src="js/script.js"></script>
</body>
</html>
