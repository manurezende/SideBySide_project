<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mensagens</title>
  <link rel="stylesheet" href="css/mensagens.css" />
</head>
<header>
    <div class="logo">SIDEBYSIDE</div>
     <a href="pagina_listar_idoso.html"></a>
    <nav>
      <a href="./pagina_listar_idoso.html">Jovens</a>
      <a href="./pagina_salvo_do_jovem.html">Salvo</a>
      <a href="./mensagens_do_jovem.html">Mensagens </a>
      <div class="user-menu">
        <img src="./img/fotos.jpg" alt="Avatar" class="avatar" onclick="toggleDropdown()" />
        <div class="dropdown" id="dropdown">
          <a href="./editar_jovem.html">Meu perfil</a>
          <a href="editar_jovem.html">Ajustes da conta</a>
          <div class="premium">
            <div>
              <strong>Obter Premium</strong>
              <a href="premium_do_jovem.html"><p>Converse com quantos Idosos você quiser.</p></a>
              
            </div>
           
          </div>
        </div>
      </div>
    </nav>
  </header>
<body>
  <div class="container">

    <!-- Lateral com contatos -->
    <aside class="contatos">
      <h2>Conversas</h2>
      <ul id="listaContatos">
        <!-- Contatos serão adicionados aqui via JS -->
      </ul>
    </aside>

    <!-- Janela de chat -->
    <main class="chat">
      <header id="nomeContato">
        <!-- Nome do contato aparecerá aqui -->
      </header>
      <div id="mensagens" class="mensagens">
        <!-- Mensagens trocadas aparecerão aqui -->
      </div>
      <footer>
        <input type="text" id="mensagemInput" placeholder="Digite sua mensagem..."/>
        <button onclick="enviarMensagem()">Enviar</button>
      </footer>
    </main>
    <script>
      // Função para alternar a exibição do dropdown
      function toggleDropdown() {
          const menu = document.getElementById("dropdown");
          menu.classList.toggle("active"); // Adiciona ou remove a classe 'active'
      }

      // Fechar o dropdown ao clicar fora dele
      window.onclick = function (event) {
          const avatar = document.querySelector('.avatar');
          const dropdown = document.getElementById("dropdown");

          // Verifica se o clique não foi no avatar ou no dropdown
          if (!dropdown.contains(event.target) && event.target !== avatar) {
              dropdown.classList.remove("active");
          }
      }
  </script>

  </div>

  <script src="js/mensagens_do_jovem.js"></script>
</body>
</html>
