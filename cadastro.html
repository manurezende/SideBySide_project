<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - SIDEBYSIDE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="backgroud-color-cadastro">
  <form action="#" method="post">
  <section class="form-container">
    <h2>Cadastro usuario</h2>
    
      <div class="div_usuario">
        <input type="text" placeholder="Nome completo" required />
        <input type="email" placeholder="E-mail" required />
        <input type="password" placeholder="Crie uma senha" required />
        <select required>
          <option value="">Sou...</option>
          <option value="0">Jovem Estudante</option>
          <option value="1">Idoso</option>
        </select>
      </div>
  </section>

  <section class="section_endereco">
    <div class="div_endereco">
      <h2>endereço</h2>
      <select required>
        <option value="">Tipo de logradouro</option>
        <option value="Rua">Rua</option>
        <option value="Avenida">Avenida</option>
        <option value="Alameda">Alameda</option>
        <option value="Travessa">Travessa</option>
        <option value="Praça">Praça</option>
        <option value="Estrada">Estrada</option>
        <option value="Rodovia">Rodovia</option>
        <option value="Viela">Viela</option>
      </select>
      <input type="text" placeholder="Nome do logradouro" required />
      <input type="text" placeholder="Numero" required />
      <input type="text" placeholder="complemento" required />
    </div>
  </section>

  <section class="section_contato">
    <div class="div_contato">
      <h2>contato</h2>
      <input type="email" placeholder="E-mail" required />
      <input type="tel" placeholder="Telefone celular" required />
      <input type="tel" placeholder="Telefone fixo" required />
      <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
      <button type="submit">Cadastrar</button>
    </div>
  </section>
  </form>

      
    
    
  
</body>
</html>
