<!-- Página de cadastro de novos usuários -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - SIDEBYSIDE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="backgroud-color-cadastro">

  <!-- Formulário principal com 3 seções -->
  <form action="#" method="post">

    <!-- Seção de dados do usuário -->
    <section class="form-container">
      <h2>Cadastro usuário</h2>
      <input type="text" name="nome_completo" placeholder="Nome completo" required />
      <input type="file" name="foto" placeholder="foto do usuario" required />
      <input type="password" name="senha" placeholder="Crie uma senha" required />
      <select name="tipo_usuario" required>
        <option value="">Sou...</option>
        <option value="1">Jovem</option>
        <option value="0">Idoso</option>
      </select>
    </section>

    <!-- Seção de endereço -->
    <section class="section_endereco">
      <h2>Endereço</h2>
      <select name="tipo_logradouro" required>
        <option value="">Tipo de logradouro</option>
        <option value="Rua">Rua</option>
        <!-- demais opções... -->
      </select>
      <input type="text" name="logradouro" placeholder="Nome do logradouro" required />
      <!-- demais campos de endereço... -->
    </section>

    <!-- Seção de contato -->
    <section class="section_contato">
      <h2>Contato</h2>
      <input type="email" name="email" placeholder="E-mail" required />
      <input type="tel" name="telefone_celular" placeholder="Telefone celular" required />
      <input type="tel" name="telefone_fixo" placeholder="Telefone fixo" required />
      <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
      <button type="submit">Cadastrar</button>
    </section>

  </form>
</body>
</html>
